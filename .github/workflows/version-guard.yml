name: Version guard

# Fails a push or PR that changes what ships in the plugin without bumping
# "version" in plugin.json. The directory scans every pushed commit, but
# `claude plugin update` only delivers a new copy when the version moved.
#
# The check lives inline here on purpose: the directory refuses script files
# (.mjs, .sh, anything starting with #!) from non-Verified organizations, so
# it cannot be a separate file in the repo.
#
# Rules, comparing BASE_SHA against HEAD:
#   1. If a file that ships changed (outside NON_SHIPPING), the version must go up.
#   2. If the version went up and CHANGELOG.md exists, it needs a "## X.Y.Z" heading.
#   3. The version never goes backwards.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version bumped when the plugin changed
        env:
          BASE_SHA: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.base.sha
                || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=.claude-plugin/plugin.json
          # Paths that never reach a user's install.
          NON_SHIPPING='^(\.claude-plugin/marketplace\.json|\.claude/.*|CLAUDE\.md|AGENTS\.md|CONTRIBUTING\.md|\.github/.*|tests?/.*|docs/.*|graphify-out/.*|CHANGELOG\.md|ROADMAP\.md|\.gitignore|\.gitattributes)$'
          SEMVER='^[0-9]+\.[0-9]+\.[0-9]+$'
          pass() { echo "PASS  version-guard  $1"; exit 0; }
          fail() { echo "FAIL  version-guard  $1"; exit 1; }

          head_v=$(jq -r '.version // empty' "$MANIFEST")
          [[ "$head_v" =~ $SEMVER ]] || fail "$MANIFEST version missing or not semver: '$head_v'"

          base="${BASE_SHA:-}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then pass "no base to compare against; $head_v not checked"; fi

          if ! prev_raw=$(git show "$base:$MANIFEST" 2>/dev/null); then
            pass "$MANIFEST did not exist at ${base:0:7}; $head_v is the first version"
          fi
          prev_v=$(jq -r '.version // empty' <<<"$prev_raw")

          if [[ "$prev_v" =~ $SEMVER && "$prev_v" == "$head_v" ]]; then
            changed=$(git diff --name-only "$base" HEAD)
            shipping=$(grep -Ev "$NON_SHIPPING" <<<"$changed" || true)
            [[ -z "$shipping" ]] && pass "$head_v unchanged; nothing that ships changed"
            total=$(wc -l <<<"$shipping")
            echo "Changed since ${base:0:7}:"; sed -n '1,15s/^/      /p' <<<"$shipping"
            (( total > 15 )) && echo "      ...and $((total - 15)) more"
            fail "the plugin changed but $MANIFEST is still $head_v. Bump \"version\" (and add it to CHANGELOG.md)."
          fi

          if [[ "$prev_v" =~ $SEMVER ]]; then
            lowest=$(printf '%s\n%s\n' "$prev_v" "$head_v" | sort -V | head -n 1)
            [[ "$lowest" == "$prev_v" ]] || fail "version went backwards: $prev_v -> $head_v"
          fi

          if [[ -f CHANGELOG.md ]]; then
            esc=${head_v//./\\.}
            changelog=$(tr -d '\r' < CHANGELOG.md)
            grep -Eq "^## \[?${esc}\]?([[:space:]]|$)" <<<"$changelog" \
              || fail "$prev_v -> $head_v, but CHANGELOG.md has no \"## $head_v\" heading"
          fi
          pass "$prev_v -> $head_v"
